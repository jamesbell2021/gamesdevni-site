 o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);
 g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

  bas:parse('A2 . A2 A2 . A2 A2 .  F2 . F2 F2 . E2 E2 .  A2 . A2 A2 . A2 A2 .  D2 . D2 D2 . E2 E2 .  A2 . A2 A2 . A2 A2 .  F2 . F2 F2 . E2 E2 .  D2 . D2 D2 . E2 E2 .  A2 . . . A2 . . .')}

let musOn=true,mus={name:null,th:null,step:0,t:0},noiseBuf=null;
function mhz(n){return 440*Math.pow(2,(n-69)/12);}
function noiseHit(d,v,hp){if(!AC||muted)return;try{if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.02);}catch(e){}}
function setMusic(n){if(mus.name===n)return;mus={name:n,th:n?THEMES[n]:null,step:0,t:0};}
function holdLen(arr,i){let n=1;while(arr[(i+n)%arr.length]===-1&&n<16)n++;return n;}
function musicTick(){const th=mus.th;if(!th||!AC||muted||!musOn)return;
 if(mus.t>0){mus.t--;return;}mus.t=th.tempo-1;
 const i=mus.step++,sd=th.tempo/60;
 const m=th.mel[i%th.mel.length];if(m>0)beep(mhz(m),holdLen(th.mel,i%th.mel.length)*sd*.92,'square',th.lead);
 const b=th.bas[i%th.bas.length];if(b>0)beep(mhz(b),holdLen(th.bas,i%th.bas.length)*sd*.9,'triangle',.07);
 const d=th.drm[i%th.drm.length];
 if(d==='k'){beep(130,.1,'sine',.13,-95);}else if(d==='s'){noiseHit(.1,.07,1500);beep(210,.06,'triangle',.04,-80);}else if(d==='h'){noiseHit(.03,.035,6000);}}

 if(scene==='title'||scene==='win')n='title';
 else if(scene==='play'||scene==='over'&&false){n=(lv&&lv.locked&&enemies.some(e=>e.boss))?'boss':'l'+(li+1);}
 setMusic(n);musicTick();}

  if(e.code==='KeyP'||e.code==='Escape'){if(scene==='play')scene='pause';else if(scene==='pause')scene='play';}}});
addEventListener('keyup',e=>{keys[e.code]=false;});

const KB=[

 {u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],p:['KeyF'],k:['KeyG'],j:['KeyH'],g:['KeyT'],s:['KeyY'],st:[]}];

  const on=e=>{e.preventDefault();touch[d[0]]=1;el.classList.add('on');audioInit();},off=e=>{e.preventDefault();touch[d[0]]=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
  document.body.appendChild(el);}
}
function readDev(id){
 const o={dx:0,dy:0,p:0,k:0,j:0,g:0,s:0,st:0};
 if(id[0]==='k'){const m=KB[+id[1]];const dn=a=>a.some(c=>keys[c]||hit[c]);
  o.dx=(dn(m.r)?1:0)-(dn(m.l)?1:0);o.dy=(dn(m.d)?1:0)-(dn(m.u)?1:0);o.p=dn(m.p);o.k=dn(m.k);o.j=dn(m.j);o.g=dn(m.g);o.s=dn(m.s);o.st=dn(m.st);}
 else if(id==='touch'){o.dx=touch.r-touch.l;o.dy=touch.d-touch.u;o.p=touch.p;o.k=touch.k;o.j=touch.j;o.g=touch.g;o.s=touch.s;}
 else{const gp=(navigator.getGamepads?navigator.getGamepads():[])[+id.slice(1)];if(!gp)return o;
  const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  o.dx=(b(15)?1:0)-(b(14)?1:0);if(!o.dx&&Math.abs(ax)>.4)o.dx=Math.sign(ax);
  o.dy=(b(13)?1:0)-(b(12)?1:0);if(!o.dy&&Math.abs(ay)>.4)o.dy=Math.sign(ay);
  o.p=b(2);o.k=b(1);o.j=b(0);o.g=b(3);o.s=b(4)||b(5)||b(6)||b(7);o.st=b(9);}
 o.any=!!(o.p||o.k||o.j||o.g||o.s||o.st);
 return o;}
const dev={};
function devList(){const l=['k0','k1'];if(isTouch)l.push('touch');
 const gps=navigator.getGamepads?navigator.getGamepads():[];for(const g of gps){if(g&&g.connected)l.push('g'+g.index);}return l;}
let anyEdge=null;
function sampleInputs(){
 const ids=devList();anyEdge=null;
 for(const id of ids){const d=dev[id]||(dev[id]={cur:{},prev:{},edge:{}});d.prev=d.cur;d.cur=readDev(id);d.edge={};
  for(const k of ['p','k','j','g','s','st','any'])d.edge[k]=!!(d.cur[k]&&!d.prev[k]);
  if(d.edge.any&&!anyEdge)anyEdge=id;}
 for(const k in hit)delete hit[k];
 for(const p of players){if(p.dev&&!ids.includes(p.dev)){p.dev=null;p.pn=0;}}
 if(scene==='title'||scene==='load'){return;}
 for(const id of ids){if(dev[id].edge.any&&!players.some(p=>p.dev===id)&&(scene==='play'||scene==='card'||scene==='clear'))assignDev(id);}
 for(const p of players){if(!p.dev)continue;const d=dev[p.dev];if(!d)continue;
  p.inp.dx=d.cur.dx;p.inp.dy=d.cur.dy;
  for(const k of ['p','k','j','g','s'])if(d.edge[k])p.buf[k]=8;
  if(d.edge.st&&p.dev!=='k1'&&scene==='play'&&p.dev.length&&(p.dev[0]==='g'||p.dev==='k0'))pauseReq=true;}
 if(pauseReq){pauseReq=false;if(scene==='play')scene='pause';}
 else if(scene==='pause'){for(const id of ids){if(players.some(p=>p.dev===id)&&dev[id].edge.st)scene='play';}}
}

 else if(scene==='win')drawWin();
 else{
  if(shake>0){ctx.translate((Math.random()*3-1)|0,(Math.random()*3-1)|0);}
  drawWorld();drawHUD();drawOverlay();
  if(scene==='clear')drawClear();
  if(scene==='over')drawOver();
  if(scene==='pause'){R(0,60,W,52,'k');TC('PAUSED',70,'Y',3,1);TC('PRESS P OR START TO RESUME',98,'W',1);}
 }
 ctx.restore();
}

/* ---------- main loop ---------- */
function startGame(id){resetPlayers();if(id&&!demo){players[0].dev=id;players[0].pn=1;}
 beginLevel(startLevel);}
function firePressed(){return anyEdge!==null;}
function step(){
 tickN++;
 sampleInputs();
 musicUpdate();
 if(borderT>0&&--borderT===0)border='k';
 if(scene==='load'){sceneT++;border=(sceneT>>2)&1?'R':'C';if(sceneT>110||firePressed()){scene='title';sceneT=0;border='k';}}
 else if(scene==='title'){sceneT++;if(firePressed()||(demo&&sceneT>10)){audioInit();SFX.start();startGame(anyEdge);}}
 else if(scene==='card'){sceneT++;if(sceneT>200||(sceneT>40&&firePressed()))scene='play';}
 else if(scene==='play'){
  if(freeze>0){freeze--;}
  else{
   for(const p of players)updPlayer(p);
   for(const e of enemies.slice())updEnemy(e);
   for(const it of items)it.age++;
   for(const pr of props)if(pr.shake>0)pr.shake--;
   updLevel();
  }
  if(shake>0)shake--;updFx();
 }
 else if(scene==='clear'){sceneT++;for(const p of players){if(!p.out){if(!p.dev)aiPlayerIdle(p);tickCommon(p);physics(p);}}updFx();
  for(const e of enemies.slice())updEnemy(e);
  if(sceneT>240||(sceneT>60&&firePressed())){if(li>=4){scene='win';sceneT=0;SFX.clear();}else beginLevel(li+1);}}
 else if(scene==='over'){sceneT++;updFx();if(demo&&sceneT>120){startGame(null);}else if(sceneT>60&&firePressed()){
   players.forEach(p=>{p.out=false;p.lives=3;p.hp=p.maxhp;});beginLevel(li);}}
 else if(scene==='win'){sceneT++;if(sceneT>90&&firePressed()){resetPlayers();scene='title';sceneT=0;}}
}
function aiPlayerIdle(p){p.inp.dx=0;p.inp.dy=0;p.vx=0;p.vy=0;if(p.st==='walk')p.st='idle';}
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__g={get scene(){return scene;},get players(){return players;},get enemies(){return enemies;},get lv(){return lv;},get li(){return li;},get camx(){return camx;},step,render,
 setScene:s=>{scene=s;},beginLevel,SFX};
</script>
