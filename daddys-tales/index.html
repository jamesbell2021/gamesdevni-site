#bookbox{position:relative}
#book{position:absolute;left:0;top:0;transform-origin:0 0;perspective:2600px;transition:translate .9s cubic-bezier(.645,.045,.355,1)}
#book .shadow{position:absolute;inset:6px -2px -14px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.4);pointer-events:none;transition:left .9s,right .9s}
.sheet{position:absolute;top:0;transform-origin:0 50%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .9s cubic-bezier(.645,.045,.355,1);will-change:transform}
.sheet.turned{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transform:translateZ(.1px)}
.face.back{transform:rotateY(180deg) translateZ(.1px)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0))}
.sheet.flipF .face.front::after{animation:shadeF .9s ease-in-out}
.sheet.flipF .face.back::after{animation:shadeB .9s ease-in-out}
.sheet.flipB .face.back::after{animation:shadeF .9s ease-in-out}
.sheet.flipB .face.front::after{animation:shadeB .9s ease-in-out}
@keyframes shadeF{0%{opacity:0}50%{opacity:.9}100%{opacity:.9}}
@keyframes shadeB{0%{opacity:.9}50%{opacity:.9}100%{opacity:0}}
.single .sheet.turned.gone{visibility:hidden}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;background-color:var(--paper);background-image:var(--fibre),var(--grain);background-size:600px,300px}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5}
.face.front .page::before{background:linear-gradient(90deg,rgba(60,35,10,.28) 0,rgba(60,35,10,.08) 4%,rgba(0,0,0,0) 9%,rgba(0,0,0,0) 96%,rgba(60,35,10,.08) 100%)}
.face.back .page::before{background:linear-gradient(270deg,rgba(60,35,10,.28) 0,rgba(60,35,10,.08) 4%,rgba(0,0,0,0) 9%,rgba(0,0,0,0) 96%,rgba(60,35,10,.08) 100%)}
.single .face.front .page::before{background:linear-gradient(90deg,rgba(60,35,10,.18) 0,rgba(0,0,0,0) 5%)}
.folio{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-family:'IM Fell English',serif;font-size:14px;color:#8a6a48;letter-spacing:.06em}
.runhead{position:absolute;top:24px;left:44px;right:44px;text-align:center;font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.14em;color:#8a6a48}
.runhead::after{content:"";display:block;margin:6px auto 0;width:60px;height:1px;background:#b8946a}

/* text pages */
.tbody{position:absolute;left:44px;right:44px;top:62px;height:520px;overflow:hidden;font-size:17.5px;line-height:1.46;text-align:justify;hyphens:auto;-webkit-hyphens:auto;color:var(--ink)}
.tbody p{margin:0;text-indent:1.3em}
.tbody p.first,.tbody p.cont{text-indent:0}
.tbody p.first::first-letter{font-family:'IM Fell English',serif;float:left;font-size:3.5em;line-height:.82;padding:.06em .08em 0 0;color:var(--oxblood)}
.tbody p.speech{text-indent:1.3em}
.ttl{text-align:center;margin:4px 0 14px}
.ttl .kicker{font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;color:#8a6a48}
.ttl h2{font-family:'IM Fell English',serif;font-weight:400;font-size:31px;line-height:1.08;margin:6px 0 8px;color:var(--oxblood)}
.rule{display:flex;align-items:center;justify-content:center;gap:8px;color:#b08850}
.rule::before,.rule::after{content:"";width:70px;height:1px;background:currentColor}
.rule span{width:6px;height:6px;transform:rotate(45deg);background:currentColor;display:block}
.fin{text-align:center;margin-top:14px;font-size:20px;color:#a07a48}

/* scene (illustration) pages */
.scene{position:absolute;left:20px;top:22px;width:400px;height:500px;perspective:1100px;perspective-origin:50% 0%;cursor:pointer;border-radius:3px}
.scene .lw{position:absolute;inset:0;transition:transform .5s ease-out}
.scene .layer{position:absolute;inset:0}
.scene .layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scene .layer.pop{transform:rotateX(84deg);opacity:0;transition:transform .35s ease-in,opacity .2s .15s;backface-visibility:hidden}
.scene .layer.pop svg{filter:drop-shadow(0 5px 3px rgba(30,15,0,.28))}
.safari .scene .layer.pop svg,.single .scene .layer.pop svg{filter:none}
.scene .layer.pop{will-change:transform}
.scene.up .layer.pop{transform:rotateX(0);opacity:1;transition:transform 1s cubic-bezier(.22,1.45,.4,1) calc(var(--i)*.16s),opacity .25s calc(var(--i)*.16s)}
.scene .frame{position:absolute;inset:-14px;pointer-events:none;z-index:4}
.scene .frame svg{width:100%;height:100%}
.caption{position:absolute;left:30px;right:30px;top:528px;text-align:center;font-family:'IM Fell English',serif;font-style:italic;font-size:22px;color:var(--oxblood);line-height:1.1}
.caption small{display:block;font-style:normal;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.18em;color:#8a6a48;margin-bottom:3px}

/* pull-tab */
.tab{position:absolute;left:50%;bottom:22px;width:320px;height:46px;margin-left:-160px;cursor:pointer;touch-action:none;z-index:6}
.tab .slot{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:#3a2414;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.5)}
.tab .knob{position:absolute;top:6px;left:0;height:34px;padding:0 16px 0 12px;display:flex;align-items:center;gap:8px;border-radius:4px 17px 17px 4px;
  background:linear-gradient(#fbf3dc,#e8d6a8);box-shadow:0 3px 6px rgba(40,20,0,.35),inset 0 0 0 1px rgba(120,80,30,.35);
  font-family:'IM Fell English',serif;font-style:italic;font-size:15.5px;color:#4a2a14;white-space:nowrap;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.tab .knob i{display:block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gilt2),var(--gilt) 55%,#8a5a1a);box-shadow:0 1px 2px rgba(0,0,0,.4);flex:none}
.tab .knob b{font-weight:400}
.tab.pulled .knob{transform:translateX(var(--pull,120px))}
.tab:not(.pulled) .knob{animation:nudge 3.2s ease-in-out 1.5s infinite}
@keyframes nudge{0%,80%,100%{transform:none}88%{transform:translateX(14px)}}

/* ---------- covers & front matter ---------- */
.cover{background:#5e1a1f;background-image:var(--grain),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 35%,#7a2428,#4a1216)}
.cover::before{background:none!important}
.cover .gilt{position:absolute;inset:16px;border:2px solid var(--gilt);border-radius:4px;box-shadow:inset 0 0 0 5px rgba(0,0,0,0),inset 0 0 0 6px var(--gilt);pointer-events:none;opacity:.9}
.cover .corner{display:block;width:44px;height:44px;color:var(--gilt)}
.cover .window{position:absolute;left:58px;top:182px;width:324px;height:324px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gilt),0 0 0 9px #5e1a1f,0 0 0 11px var(--gilt),inset 0 0 24px rgba(0,0,0,.6)}
.cover .window .scene{left:-38px;top:-150px;width:400px;height:500px;cursor:default}
.cover h1{position:absolute;top:44px;left:0;right:0;margin:0;text-align:center;font-family:'IM Fell English',serif;font-weight:400;font-size:62px;line-height:1;
  background:linear-gradient(180deg,#fff0b8 0%,var(--gilt2) 35%,var(--gilt) 60%,#9a6420 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a0a0a) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.cover .sub{position:absolute;top:120px;left:0;right:0;text-align:center;font-family:'IM Fell English SC',serif;font-size:16px;letter-spacing:.22em;color:var(--gilt2)}
.cover .by{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-family:'IM Fell English',serif;font-style:italic;font-size:19px;color:var(--gilt2)}
.cover .open{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.2em;color:#e7c27a;opacity:.8;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.endpaper{background:#24305a}
.endpaper::before{background:none!important}
.endpaper svg{position:absolute;inset:0;width:100%;height:100%}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px}
.ded h3{font-family:'IM Fell English SC',serif;font-weight:400;font-size:15px;letter-spacing:.24em;color:#8a6a48;margin:0 0 18px}
.ded .names{font-family:'IM Fell English',serif;font-size:40px;line-height:1.15;color:var(--oxblood)}
.ded .names em{display:block;font-size:22px;color:#6a4a2a;margin:6px 0}
.ded p{font-size:19px;line-height:1.5;font-style:italic;margin:22px 0 0;max-width:300px}
.ded .sign{font-family:'IM Fell English',serif;font-size:26px;margin-top:18px;color:#4a2a14}
.howto h3,.toc h3{font-family:'IM Fell English',serif;font-weight:400;font-size:30px;color:var(--oxblood);margin:0 0 6px}
.howto ul{list-style:none;padding:0;margin:20px 0 0;text-align:left;font-size:17.5px;line-height:1.4}
.howto li{display:flex;gap:14px;align-items:center;margin:0 0 16px}
.howto li svg{flex:none;width:46px;height:46px}
.howto .warn{margin-top:10px;font-style:italic;color:#7a1f22;font-size:17px}
.toc{position:absolute;inset:0;padding:28px 40px}
.toc h3{text-align:center}
.toc ol{list-style:none;padding:0;margin:10px 0 0;font-size:15px;line-height:1.16}
.toc li{display:flex;align-items:baseline;gap:6px;cursor:pointer;padding:1px 0;border-radius:3px}
.toc li:hover{color:var(--oxblood)}
.toc li span.d{flex:1;border-bottom:1px dotted #b8946a;transform:translateY(-4px)}
.toc li.bk{cursor:default;font-family:'IM Fell English SC',serif;letter-spacing:.18em;font-size:12px;color:#8a6a48;justify-content:center;margin-top:2px}
.filler .medal{width:180px;height:180px}
.filler .next{font-family:'IM Fell English SC',serif;font-size:13px;letter-spacing:.2em;color:#8a6a48;margin-top:22px}
.filler .nt{font-family:'IM Fell English',serif;font-style:italic;font-size:28px;color:var(--oxblood);margin-top:6px}
.booktwo .big{font-family:'IM Fell English',serif;font-size:56px;color:var(--oxblood);line-height:1}
.endp .scene{cursor:default}
.endp .big{position:absolute;left:0;right:0;top:528px;text-align:center;font-family:'IM Fell English',serif;font-size:38px;color:var(--oxblood)}
.endp .night{position:absolute;left:0;right:0;top:575px;text-align:center;font-style:italic;font-size:19px;color:#5a3a20}
.backc .blurb{position:absolute;left:60px;right:60px;top:200px;text-align:center;color:var(--gilt2);font-family:'IM Fell English',serif;font-size:20px;line-height:1.5}
.backc .blurb b{display:block;font-weight:400;font-size:40px;margin-bottom:20px;background:linear-gradient(180deg,#fff0b8,var(--gilt) 60%,#9a6420);-webkit-background-clip:text;background-clip:text;color:transparent}
.backc .small{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.2em;color:#e7c27a;opacity:.75}

/* corner curl hint on the right-hand page */
.curl{position:absolute;right:0;bottom:0;width:34px;height:34px;z-index:7;pointer-events:none;background:linear-gradient(135deg,rgba(0,0,0,0) 50%,#d9c69a 50%,#f4e8cc 70%,#e0cfa4);box-shadow:-2px -2px 4px rgba(0,0,0,.12);border-top-left-radius:8px;animation:curl 3s ease-in-out infinite;transform-origin:100% 100%}
@keyframes curl{0%,70%,100%{transform:scale(.55)}82%{transform:scale(1)}}
.face.back .curl,.single .face .curl.l{display:none}

/* ---------- toolbar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)!important;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px}
.wbtn{position:relative;height:42px;min-width:44px;padding:0 16px;border:0;border-radius:3px;cursor:pointer;font-family:'IM Fell English SC',serif;font-size:16px;letter-spacing:.06em;color:#f6dfa8;
  background:linear-gradient(180deg,#6a3c1e,#4a2610 60%,#3a1c0a);box-shadow:0 0 0 1px #2a1408,inset 0 0 0 2px rgba(217,164,65,.55),0 3px 8px rgba(0,0,0,.5)}
.wbtn::before,.wbtn::after{content:"";position:absolute;width:7px;height:7px;border:1.5px solid var(--gilt);opacity:.9}
.wbtn::before{left:4px;top:4px;border-right:0;border-bottom:0}
.wbtn::after{right:4px;bottom:4px;border-left:0;border-top:0}
.wbtn:active{transform:translateY(1px)}
.wbtn:disabled{opacity:.4;cursor:default}
.wbtn.round{width:42px;padding:0;border-radius:50%;font-size:19px}
.wbtn.round::before,.wbtn.round::after{display:none}
#pg{min-width:76px;text-align:center;font-family:'IM Fell English',serif;font-style:italic;color:#cbb88e;font-size:15px}
#home{display:none;text-decoration:none;line-height:42px;text-align:center}
.onsite #home{display:inline-block}
@media (max-height:500px){#bar{height:calc(50px + env(safe-area-inset-bottom))}.wbtn{height:36px}.wbtn.round{width:36px}#home{line-height:36px}}
@media (max-width:560px){.wbtn{padding:0 11px;font-size:15px;white-space:nowrap}.wbtn .w{display:none}#pg{min-width:34px;font-size:13px}#bar{gap:7px}}
#hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);font-family:'IM Fell English',serif;font-style:italic;color:#e6d4aa;font-size:15px;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
#hint.show{opacity:.9}

/* ---------- scene animation helpers ---------- */
.scene svg *{transform-box:fill-box}
.sv-rise{transform:translateY(var(--dy,40px));opacity:0;transition:transform .9s cubic-bezier(.3,1.45,.5,1) var(--d,0s),opacity .4s var(--d,0s)}
.on .sv-rise{transform:none;opacity:1}
.sv-hid{opacity:0;transition:opacity .5s var(--d,0s)}
.on .sv-hid{opacity:1}
.sv-pre{transition:opacity .4s}
.on .sv-pre{opacity:0}
.sv-grow{transform-origin:50% 100%;transform:scale(0);transition:transform .55s cubic-bezier(.3,1.7,.5,1) var(--d,0s)}
.on .sv-grow{transform:scale(1)}
.sv-drop{transform:translateY(-520px);opacity:0;transition:transform .42s cubic-bezier(.55,0,.6,1.35),opacity 0s .42s}
.on .sv-drop{transform:none;opacity:1;transition:transform .42s cubic-bezier(.55,0,.6,1.35),opacity 0s}
.sv-door{transform-origin:100% 50%;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.on .sv-door{transform:scaleX(.1) skewY(-8deg)}
.sv-lidoff{transition:transform .8s cubic-bezier(.3,1.1,.5,1),opacity .6s .4s}

.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.blinkred{animation:blinkred 1.2s steps(2) infinite}
@keyframes blinkred{50%{opacity:.15}}
.drift{animation:drift 14s ease-in-out infinite alternate}
.drift.slow{animation-duration:20s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(-60px)}}
.rain{animation:rain .5s linear infinite}
@keyframes rain{to{transform:translate(-8px,26px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.floaty{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px) rotate(2deg)}}
.swing{transform-origin:50% 0;animation:swing 2.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
.wag{transform-origin:100% 100%;animation:wag .4s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(-25deg)}}
.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{transform-origin:50% 100%;animation:flame .35s ease-in-out infinite alternate}
@keyframes flame{to{transform:scale(.88,1.12) skewX(4deg)}}
.flicker{animation:flicker .3s infinite alternate}
@keyframes flicker{to{opacity:.12}}
.tvflick{animation:flicker .2s infinite alternate}
.wiggle{transform-origin:0% 50%;animation:wiggle 1.4s ease-in-out infinite alternate}
@keyframes wiggle{to{transform:rotate(10deg)}}
.flap{transform-origin:100% 50%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.4)}}
.fly{animation:fly 1.2s linear infinite}
@keyframes fly{25%{transform:translate(8px,-6px)}50%{transform:translate(0,-12px)}75%{transform:translate(-8px,-6px)}}
.kick{animation:kick .5s ease-in-out infinite alternate}
@keyframes kick{to{transform:translateY(6px)}}
.weed{transform-origin:50% 100%;animation:weed 3s ease-in-out infinite alternate}
@keyframes weed{to{transform:skewX(8deg)}}
.rise-bub{animation:risebub 2.4s ease-in infinite}
@keyframes risebub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
.steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-6px) skewX(6deg);opacity:.3}}
.spore{animation:spore 3s ease-in-out infinite}
@keyframes spore{50%{transform:translate(6px,-14px)}}
.gull{animation:gull 9s linear infinite}
@keyframes gull{50%{transform:translate(60px,-14px)}}
.whisper{animation:twinkle 2s ease-in-out infinite}
.heart{transition:opacity .5s var(--d,0s),transform 1.2s var(--d,0s)}
.on .heart{transform:translateY(-24px)}
.page:not(.vis) .scene *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.scene svg *{animation:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<div id="stage"><div id="bookbox"><div id="book"><div class="shadow"></div></div></div></div>

  <button class="wbtn round" id="snd" aria-label="Sound on or off" title="Sound">&#9835;</button>
  <button class="wbtn" id="next" aria-label="Next page"><span class="w">Next </span>&rsaquo;</button>

<script>const STORIES = [{"title": "The Wee Man in the Well", "paras": ["Once upon a time, in a small village, there lived a strange and mysterious little man who lived in a deep, dark well. No one knew where he came from or how long he had been living there, but they all knew to stay away from the well.", "The villagers whispered that the little man was not to be trusted, that he used bread and butter to lure unsuspecting travellers to the well, promising them a warm meal and a place to rest. But once they were inside, he would push them into the water, drowning them in the depths of the well.", "One night, a young couple travelling through the village stopped to ask for directions. They were tired and hungry, and the little man offered them bread and butter, promising them a warm meal and a place to sleep. The couple, not knowing the danger, followed the little man to the well. When they reached the well, the little man reached out his hand, offering them a piece of bread and butter. But as soon as the couple took the bread, the little man pushed them into the well. The couple screamed in terror as they fell into the dark, cold water.", "The villagers heard the screams and they rushed to the well, but it was too late. The couple was gone, and the little man was nowhere to be found. From that day on, the villagers avoided the well and warned others to stay away. But some say that on quiet nights, you can still hear the screams of the little man's victims echoing from the well. And some say that if you look closely, you can see the little man's eyes peering out from the darkness, waiting for his next unsuspecting victim."]}, {"title": "The wee man in the walls", "paras": ["Once upon a time, in a small, cosy house, there lived a wee skinny man. He was so small that no one in the house ever saw him. He lived deep in the walls of the house and came out only at night when everyone was asleep.", "The wee skinny man had a peculiar habit. He loved to sneak into the kitchen and lick the butter out of the fridge. He would wait for everyone to go to bed and then he would sneak out of his hiding spot in the walls. He would tiptoe across the floor, open the fridge and lick the butter off the butter dish.", "One night, the family who lived in the house decided to leave a camera in the kitchen to see if they could catch the mysterious butter licker. They were surprised to see the footage of the wee skinny man sneaking out of the walls and licking the butter.", "The family was curious about the wee skinny man and decided to leave a note for him in the butter dish. The note read, \"Dear Butter Licker, we know who you are and we would like to meet you. Please come out and talk to us.\"", "The next night, the wee skinny man saw the note and decided to come out of hiding. The family was shocked to see how small he was, but they were also delighted to have finally met him. They asked him why he loved to lick the butter and he explained that he was so small that he needed to eat a lot of butter to survive.", "The family felt sorry for the wee skinny man and decided to help him. They gave him a special diet of healthy foods and made sure he had plenty of butter. The wee skinny man was very grateful and promised to never sneak into the kitchen again.", "From then on, the wee skinny man lived happily with the family and never had to sneak into the kitchen for butter again. He was no longer skinny and he was happy to have made friends with the family.", "The end."]}, {"title": "The butter licker", "paras": ["Once upon a time, in the small town of Cairnshill, there lived a mysterious creature known as the \"Butter Licker.\" No one had ever seen the Butter Licker, but they all knew of its existence. Every morning, the residents of Cairnshill would wake up to find their butter dishes licked clean. No one knew where the butter was going or who was taking it, but everyone was on high alert.", "The townspeople tried everything to stop the Butter Licker. They set traps, left out decoy butter dishes, and even hired a night watchman to patrol the streets. But nothing seemed to work. The Butter Licker was always one step ahead.", "One night, a young boy named Timmy decided to take matters into his own hands. He stayed up late, determined to catch the Butter Licker in the act. As he sat in his kitchen, he heard a faint noise coming from the living room. He slowly crept towards the sound and saw a small, shadowy figure sneaking towards the butter dish.", "Timmy couldn't believe his eyes. The Butter Licker was real! And it was a tiny creature, no bigger than a mouse. Without thinking, Timmy lunged for the creature, but it was too quick and scurried away.", "The next morning, Timmy told the townspeople what he had seen. They were shocked and amazed. They had never imagined that the Butter Licker would be so small. They decided to set up a trap with a small piece of cheese, hoping to lure the creature back.", "That night, the Butter Licker returned. As it reached for the cheese, the trap snapped shut, capturing the Butter Licker. The townspeople were overjoyed and they gathered around to see their captive.", "To their surprise, the Butter Licker was actually a kind and friendly creature. It explained that it had always lived in the walls of the houses in Cairnshill and had never meant any harm. It simply loved the taste of butter.", "The townspeople felt bad for the Butter Licker and decided to release it. They made a deal with the creature that it could lick butter to its heart's content, but only from the butter dishes in the town square.", "From then on, the Butter Licker was no longer feared, but loved. Every night, the townspeople would gather in the town square and watch as the Butter Licker licked butter. They even made a statue in its honour and named it the \"Butter Licker of Cairnshill.\""]}, {"title": "Jamie", "paras": ["Once upon a time, in a small town called Cairnshill, there lived a bear named Jamie. Jamie was a very curious bear and loved to explore the town. One day, Jamie came across a jam factory and decided to sneak in and see what it was all about.", "As Jamie wandered around the factory, he couldn't help but notice all the delicious-smelling jars of jam. He couldn't resist and decided to try a taste of the strawberry jam. He reached for a jar and as he was trying to open it, he accidentally knocked over a whole shelf of jars.", "The noise alerted the factory workers and they quickly ran to investigate. When they saw Jamie covered in jam, they panicked and quickly put him in a large jar of mixed fruit jam. They sealed the lid, labelled the jar \"Defective\" and sent it to the local Tesco shop.", "A few days later, a lady named Claire and her lovely daughter Sana were shopping in Tesco when they came across the jar labelled \"Defective\" and discounted. Claire was intrigued and decided to buy the jar.", "When they got home and opened the jar, they were surprised to find Jamie the jam bear inside. Jamie was relieved to finally be out of the jar and grateful to Claire and her daughter for rescuing him.", "Claire and Sana took Jamie in as their own and took care of him. They gave him a proper diet and helped him to clean up all the jam. Jamie was so happy to have found a new home and family. He loved to play with Sana and help Claire in the kitchen, taste-testing all the jams and jellies she made.", "From then on, Jamie lived happily with Claire and Sana, and was known as the Jam Bear of Cairnshill. He would never forget his adventure in the jam factory and was grateful for the love and care he received from his new family."]}, {"title": "Corn patch jack", "paras": ["There was an old man with beady eyes who lived in a corn patch by the lake. He was a reclusive figure, rarely seen by anyone except for the occasional picnicker who happened to stumble upon him while enjoying a sandwich by the water's edge. The old man had a peculiar habit of sneaking up on these picnickers and stealing a bite or two of their sandwiches while they were swimming. The picnickers would often come back to find their sandwiches half-eaten and would shrug it off as the work of a mischievous squirrel or raccoon. But the truth was, it was the old man with the beady eyes who was the culprit.", "One day, a group of picnickers caught the old man red-handed as he was sneaking up on their sandwiches. They were shocked and frightened by the sight of him, his wild hair and scraggly beard, and his beady eyes staring at them hungrily. They immediately called the authorities.", "The authorities arrived and searched the corn patch for the old man, but he was nowhere to be found. Just as they were about to give up, a man driving a combine harvester came by and offered to help with the search.", "The man drove the combine harvester around and around the corn patch, scouring every inch of it. Eventually, the old man was found hiding in a field of cornstalks. The man driving the combine harvester wasted no time and harvested him up, trapping the old man in the machine.", "The old man was never seen again, but sometimes people would find bits of him in their cornflakes. The picnickers were relieved to know that they would no longer have to worry about their sandwiches being stolen by the old man with the beady eyes. But they couldn't help but feel a twinge of sadness for the lonely old man who had made the corn patch his home."]}, {"title": "The wee man", "paras": ["Once upon a time, deep in the heart of the forest, there lived a strange creature known as the wee man. He was a small, gnarled figure with a twisted face and long, spindly legs that seemed to go on forever.", "No one knew where the wee man came from, or why he chose to hide deep in the forest, lurking in the shadows and watching the unsuspecting hikers who ventured too far from the trail.", "But those who knew of him feared him greatly, for it was said that if a hiker got lost in the forest, the wee man would come out of hiding and snatch them away, never to be seen again.", "Despite the warnings, there were always those who refused to believe in the wee man's existence. They scoffed at the stories and ventured deeper into the forest, convinced that they were too smart and too strong to fall prey to such a creature.", "But the wee man was always there, watching and waiting. And one by one, the sceptics disappeared into the forest, never to be seen again.", "The locals knew that the best way to avoid the wee man was to stay on the trail and not wander too far into the woods. But for those who were unlucky enough to cross his path, there was no escape from the wee man's long, spindly legs and twisted grasp.", "And so the legend of the wee man with the long legs lives on, warning all who enter the forest to be careful, for the wee man is always lurking, waiting for his next unsuspecting victim."]}, {"title": "The banshee", "paras": ["There was once a small village nestled in the heart of the countryside, where the people lived in peace and harmony. But there was one thing that terrorised the villagers, and that was the banshee.", "The banshee was a ghostly figure, a woman dressed in white who was said to have died a tragic death. She was known for her piercing scream that could be heard for miles around, and for the way she knocked on the door of her victims thirteen times before taking them away into the fog, never to be seen again.", "One dark and stormy night, a young couple who lived on the edge of the village heard the sound of thirteen knocks on their door. They were horrified when they opened the door to find the banshee standing before them, her ghostly face twisted in an anguished scream.", "The couple tried to run, but the banshee was too fast. She reached out with her ghostly hands and dragged them into the fog, never to be seen again.", "From that night on, the villagers lived in fear of the banshee and her thirteen knocks. They knew that if they heard her knock, it was already too late. They would be taken away into the fog, never to be seen again.", "Some say that the banshee still roams the countryside, her ghostly scream echoing through the night as she searches for her next victim. Some say that if you hear her knock, you should run and never look back, for if you do, you will be taken away into the fog, never to be seen again.", "Long ago, in a small village nestled in the heart of the countryside, there was a banshee who terrorised the villagers with her piercing scream and the way she knocked on the door of her victims thirteen times before taking them away into the fog, never to be seen again.", "People feared her and avoided her, but one brave young man decided to put an end to her terror once and for all. He went into the forest, determined to find the banshee's bones and put them to rest.", "After days of searching, he finally found her grave deep in the heart of the woods. But when he dug up the bones, he realised that they were not the bones of a woman at all, but the bones of a young girl who had died a tragic death.", "The young man was filled with remorse for what he had done. He realised that the banshee's screams and knocks were not out of malice, but out of pain and sorrow. He knew that he had to make things right.", "He buried the girl's bones properly and built a small shrine to honour her memory. From that day on, the banshee's screams and knocks were no longer heard in the village. The villagers finally found peace, and the young man found redemption.", "The moral of this story is that sometimes what we perceive as something scary or evil might just be a manifestation of pain and sorrow, and it's important to understand the root cause of things before taking actions that might cause more harm."]}, {"title": "Bobby Jelly Belly", "paras": ["Once upon a time, there was a little boy named Bobby Jelly Belly. Bobby loved ice cream more than anything in the world. He would eat it every day, for breakfast, lunch and dinner. He couldn't get enough of it.", "One day, Bobby decided to go to the playground with his friends. They had a great time playing on the swings and the slide. But when it was time for a break, Bobby's friends wanted to go and get some ice cream. Bobby was so excited that he couldn't wait to get his hands on his favourite treat. The ice cream man had a special treat that day, a giant sundae with all the toppings. Bobby couldn't resist; he ate the whole thing in one go. But as soon as he finished, he started to feel a bit strange. His belly was getting bigger and bigger, until it was so big that he couldn't stand up straight.", "Bobby's friends started to laugh at him; they thought it was so funny. But Bobby didn't think it was funny at all. He tried to run away, but his belly was so big that he couldn't move. Suddenly, he started rolling down the hill. He rolled and rolled and rolled, until he finally burst open!", "All the ice cream that was inside of Bobby spilled out and covered the playground. The children were so excited; they had never seen so much ice cream before. They ran around and ate as much as they could. Bobby's friends were so happy; they had never tasted ice cream that was so delicious.", "And as for Bobby, well, he was just happy to have made all his friends happy. He was no longer with us, but his memories and the taste of his ice cream will be with them forever.", "The end."]}, {"title": "The knocking box", "paras": ["Patrick had been digging in the peat bog for hours when he stumbled upon a wooden box buried in the muck. As the sun began to set, he decided to take the box home to his cottage to investigate its contents.", "By the time Patrick arrived home, it was dark, and he was too exhausted to open the box. He dragged it into his cottage and placed it beside his bed before he collapsed into a deep sleep. In the middle of the night, Patrick was awakened by a loud knocking sound. When he opened his eyes, he saw a shadowy figure standing at the foot of his bed. He tried to scream, but the figure lunged at him, knocking him unconscious.", "When Patrick came to, he was trapped inside the box, buried deep in the peat bog. He screamed for help until his throat was raw, but nobody could hear him.", "Days turned into weeks, and Patrick's screams slowly faded to desperate knocking as his energy waned. Eventually, the knocking stopped altogether, and the bog became still and silent.", "Years passed, and nobody knew what had happened to Patrick. His family and friends assumed he had left town or died in the bog. But the truth was far more horrifying.", "Unbeknownst to anyone, Patrick had become something else entirely during his time trapped in the box. He had been consumed by the darkness and the fear, and when he finally emerged from the bog, he was no longer human.", "Patrick became the monster of the peat bog, preying on unsuspecting travellers and dragging them down into the depths of the muck. He used the same box that had trapped him to ensnare his victims, luring them with the promise of treasure or valuable trinkets.", "And so it went for years, until Patrick had become nothing more than a legend, a terrifying myth that parents whispered to their children at bedtime. But the truth was much worse than any legend could ever convey.", "For in reality, Patrick was still out there, waiting for his next victim to uncover the box and unleash the horrors that lay within. And if someone did happen to stumble upon the box, they would find themselves buried alive in the peat bog, never to be seen again."]}, {"title": "The curse of the weresheep", "paras": ["Once upon a midnight dreary, the O'Neil family had sought refuge in the Ballagh Cottage, nestled deep in the heart of the Mourne Mountains. It was a place of peace and quiet, a haven from the hustle and bustle of everyday life.", "But one fateful night, the tranquillity was shattered when the youngest child, Connor, was bitten by a strange and dirty-looking sheep. The family quickly rushed him back to the cottage, hoping to tend to his wound and put his mind at ease.", "But as the night wore on, something began to stir within Connor. His fever rose, and he began to writhe in agony, his body contorting in ways that were not human.", "It was then that the family realised with horror that something was terribly wrong. Connor had been bitten by a weresheep, a creature of the night that transformed ordinary people into beasts. As the moon rose high in the sky, the family huddled together in terror, listening to the sounds of Connor's transformation. They knew that when the sun set, he would become a creature of the night, a monster with a thirst for blood and an insatiable hunger for flesh.", "As the night dragged on, the family barricaded themselves in the cottage, hoping against hope that they could ride out the terror that had descended upon them. But it was in vain, for when the morning came, Connor was gone.", "In his place was a creature unlike any they had ever seen, a weresheep with a matted coat and glowing red eyes. It bellowed with a rage that shook the very foundations of the cottage, and the family knew with a sickening feeling in the pit of their stomachs that they were next.", "They could hear the creature snarling and growling outside the door, its claws scratching against the wood. They knew that it was only a matter of time before it broke through, and they would be at its mercy.", "And so, with a heavy heart and trembling hands, the family prepared to meet their fate. They knew that they would not survive the night, that they would become just another cautionary tale for those who dared to venture into the dark and haunted Mourne Mountains.", "For the weresheep had come to claim its victims, and there was no escape from the terror that had been unleashed upon the Ballagh Cottage."]}, {"title": "Diet Coke", "paras": ["Once upon a time, in a far-off land, there lived a mummy named Claire. Claire was no ordinary mummy, though. She had a secret addiction to diet cola.", "Every day, Claire would guzzle down gallons and gallons of diet cola, her love for the fizzy drink growing stronger with each sip. She loved the way the bubbles tickled her nose and the sweet taste that filled her mouth.", "But one fateful day, Claire drank so much diet cola that something strange happened. She began to float into the sky, carried by the bubbles of the soda.", "Up, up, and away she soared, higher and higher into the clouds. Claire was having the time of her life, until she realised she was lost. She had floated so far away that she didn't know how to get home.", "As she floated, she spotted a group of animals below her. They were following her, but she couldn't tell why. She thought they might be after her diet cola, which she still had in her hand. Suddenly, she saw the leader of the animals, a friendly donkey, neighing and waving his tail, trying to catch her attention. He led the way, as Claire followed. She burped and farted to keep herself in the air, and the donkey led her back to her home.", "When Claire finally landed, she was relieved to be back on the ground. But she knew she needed to cut back on the diet cola. She didn't want to risk floating away again.", "And so, Claire learned a valuable lesson about moderation and the dangers of too much soda. But she also learned that sometimes, when life gives you a problem, all you need is a good burp and fart to solve it. And that, with a little help from her animal friends, she could always find her way home."]}, {"title": "Bear", "paras": ["Once upon a time, in a small village nestled in the heart of a dense forest, there was a bear with one incredibly sharp fang. The villagers were terrified of the bear, for it would bite any child who ventured into the woods alone. Parents warned their children to stay away from the woods, but the curiosity of young minds often led them to disobey.", "One day, a boy named Thomas snuck away from his parents to explore the woods alone. As he wandered deeper into the forest, he heard a loud growling sound. He turned around and saw the bear with the sharp fang, staring at him with its fierce eyes.", "Thomas was scared beyond words, frozen in place, but he remembered hearing that animals could sense fear. So he stood as still as a statue, hoping the bear wouldn't attack. The bear slowly approached him, ready to pounce at any moment.", "But then, something unexpected happened. The bear sniffed at the boy, and then nudged him gently with its nose. Thomas realised that the bear was not trying to hurt him, but was simply curious. He noticed that the bear had one incredibly sharp fang that glinted in the sunlight. Suddenly, Thomas had an idea. He had brought along a tin of food, but he had forgotten a can opener. He wondered if the bear's sharp fang could do the job. Tentatively, he offered the tin to the bear, and the bear eagerly grabbed it with its powerful jaws. With one swift motion, the bear used its sharp fang to puncture the tin, revealing the delicious contents inside.", "Thomas was amazed, and he realised that the bear could be his ally. He started bringing canned food to the forest, and using the bear's sharp fang to open them. The bear, grateful for the food, allowed Thomas to get close to it, and even play with it.", "Soon, other villagers noticed Thomas's new friend, and they too started bringing canned food to the forest to share with the bear. Before long, the bear had moved into the village and become a fixture of the community. It no longer had to hunt for food, and it no longer posed a threat to the children.", "And so, the bear with the sharp fang became a beloved member of the village. It had once been feared, but now it was cherished for its unique talents and its friendship with Thomas."]}, {"title": "Donkey", "paras": ["The family had thought that their trip to the Mourne Mountains would be an idyllic retreat, an escape from the bustle of city life. But as the storm raged on outside, they knew that they had made a grave mistake.", "The wind howled through the trees, and rain battered against the windows with an almost supernatural force. And as the night wore on, the sounds outside became more and more ominous.", "The first sign that something was amiss came when the family's dog began to bark, loudly and persistently. They could hear him scratching at the door, desperate to be let inside. But when they opened the door, they found nothing but the darkness and the rain.", "It was then that the family heard the sound of hooves outside. At first, they thought it was a horse, but as the sound grew closer, they realised that it was something far more sinister.", "The dead donkey rose up from the ground, its eyes glowing with an otherworldly light. Its coat was matted and soaked, and its flesh was rotting away, revealing the bones beneath. But despite its grotesque appearance, it moved with a surprising speed and grace.", "The family frantically tried to escape, but the donkey was relentless, smashing through doors and walls in pursuit of its prey. They realised that they had nowhere to run, and that their only hope was to barricade themselves in the bedroom and wait until sunrise.", "They could hear the donkey's hooves pounding against the wooden floor, growing louder and more frenzied by the second. And as they huddled together in fear, they realised that their barricade might not hold for long.", "The donkey's attacks became more ferocious, and they could feel the door shaking under the impact. The family desperately searched for something, anything, that they could use to defend themselves.", "And that's when they saw it: a sword, hanging on the wall, a family heirloom that had been passed down for generations. They grabbed it and prepared for the worst.", "The donkey finally broke through the door, and the family stood face-to-face with the undead creature. Its eyes glowed with an eerie light, and its fetid breath filled the room. But the family didn't back down; they stood their ground, wielding the sword with all their might.", "The battle was fierce and brutal, with the family narrowly avoiding the donkey's deadly attacks. But finally, as the first rays of sunlight broke through the clouds, the donkey let out a final, ear-splitting bray and disappeared into the morning mist.", "The family emerged from the cottage, battered and traumatised but alive. They could feel the weight of the night's events on their shoulders, knowing that they had faced a horror that few others could even imagine.", "As they drove away from the cottage, they vowed never to return. But even now, years later, they can still feel the chill that ran down their spines on that fateful night, the dread that gripped their hearts as they faced the undead donkey in battle. And they know that they will never forget the horror of the Mourne Mountains."]}, {"title": "Belfast Zoo Weremonkey", "paras": ["The small boy had always loved visiting the Belfast Zoo. The exotic animals and lush greenery had always captured his imagination. But on this particular visit, something seemed off.", "As he wandered through the zoo, he stumbled upon a small, neglected section of the park, hidden behind overgrown bushes and tall grass. And in the back of this section, he found a cage unlike any other in the zoo.", "It was old, rusted, and clearly hadn't been used in years. But there was something inside it, something that the boy couldn't quite make out. He approached the cage and gave it a tentative shake, and that's when he saw it.", "A creature, unlike any he had ever seen before, emerged from the shadows. It was like a monkey, but with a strange, almost human-like quality to its face. And it was angry.", "Without warning, the creature lunged at the boy, sinking its sharp teeth into his arm. The boy screamed in terror, and the creature ran off into the darkness.", "Over the next few days, the boy started to feel strange. His senses became heightened, and he found himself craving raw meat. And then, on the third day, he transformed.", "The boy's parents were horrified when they saw him. He had become something beyond their worst nightmares. His face was twisted and distorted, his body covered in fur. And he was angry, so very, very angry.", "The boy, now a weremonkey, escaped from his home and ran through the streets of Belfast, wreaking havoc wherever he went. He tore apart the fruit section of a Tesco store, leaving a trail of destruction in his wake.", "The police were called, and they chased the boy through the city streets. But he was too fast, too strong, and too ferocious. They eventually cornered him in a dark alleyway, where they managed to capture him with tranquilliser darts.", "The boy was taken back to the zoo, where he was placed in the same cage as the creature that had bitten him. The zookeepers had always suspected that there was something cursed about that cage, and now they knew for sure.", "The boy was transformed, his humanity stripped away, and he lived out the rest of his days in that cage. He became the star attraction of the zoo, with tourists coming from all over the world to see the weremonkey and hear his terrible story.", "But those who knew the truth, those who had seen the curse of the weremonkey first-hand, knew to stay away from that cage. They knew that the creature inside was not just an animal, but something far more sinister. They knew that the curse of the weremonkey was real, and that it could strike anyone, at any time.", "And so, the weremonkey lived on, a terrifying reminder of the dark, twisted forces that lurk just beyond the veil of our reality. Beware the weremonkey, they whispered, lest you too become trapped in that cursed cage, forever transformed into something inhuman and terrible."]}, {"title": "Birdie", "paras": ["Once upon a time, in the west of Ireland, there was a man with a bird's head who perched in a cave high up in the cliffs. No one knew how he came to have a bird's head, but they all knew to stay far away from his cave. It was said that he would peck people who got lost in the cliffs, and that he enjoyed nothing more than the taste of human flesh.", "The villagers lived in fear of the bird-headed man, and they warned their children never to venture too close to the cliffs. But one day, a young boy named Seán wandered too far from his home and found himself lost in the cliffs. He stumbled upon the bird-headed man's cave, and he was terrified.", "The bird-headed man looked at Seán with hungry eyes, and Seán was sure that he was going to be pecked to death. But then he remembered something his mother had told him: that the way to a man's heart is through his stomach. Seán reached into his pocket and pulled out a packet of Monster Munch, offering it to the bird-headed man.", "To his surprise, the bird-headed man took the packet and began to eat the crisps. Seán watched in amazement as the man's eyes softened. He spoke to Seán in a squawking voice, thanking him for the crisps and promising not to harm him.", "Seán was relieved, but he was also curious. He asked the man how he came to have a bird's head, and the man told him a sad tale of a curse that had been put upon him by a wicked witch, which made him aggressive, bird-headed and unable to talk. The curse could only be broken if someone showed him kindness and compassion. Seán had done just that, and now he could talk again.", "From that day forward, the bird-headed man was no longer a monster. He still had a bird's head, but inside he was himself again. He became a kind and gentle man, who loved nothing more than to sit with Seán and share stories. He even joined a travelling freak show, where he made new friends and found a new purpose in life.", "The villagers were shocked when they saw the bird-headed man in the freak show, but they were also amazed by the transformation in his personality. They realised that he had never truly been a monster at all, but rather a man who had been cursed and misunderstood.", "Seán was proud to call the bird-headed man his friend, and he visited him often in the freak show. They would sit together and eat Monster Munch, sharing stories and laughing together. And so, the bird-headed man lived out the rest of his days in happiness and contentment. He was no longer feared or reviled, but rather loved and respected by all who knew him. He also made good money from the people who paid to see him and all the other freaks. Seán knew that he had made a difference in the man's life, just by offering him a simple packet of crisps."]}, {"title": "The fungus child", "paras": ["Once there was a boy named Tommy who loved to play outside barefoot. He would run through the grass and splash in the streams near his house. One day, while playing in the woods, he stubbed his toe on a sharp rock. It hurt, but he didn't think much of it.", "However, over the next few weeks, his toe began to itch and sting. Tommy tried everything to make it feel better, but nothing seemed to work. Finally, he noticed a strange greenish-yellow colour spreading across his nail. He went to the doctor, who diagnosed him with a fungal infection and prescribed an antifungal cream.", "At first, the cream seemed to be working. Tommy's toe stopped itching, and the colour began to fade. But one night, he woke up to a strange sensation. It felt like something was growing inside his toe. He looked down and saw tiny mushroom-like structures poking out of his skin.", "Tommy was terrified. He ran to his parents' room, screaming about the mushrooms growing on his toe. But when they turned on the light, they saw something even more horrifying. Tommy's entire foot was covered in fungus. His skin had turned a sickly green, and mushrooms sprouted from every part of his foot.", "His parents rushed him to the hospital, but it was too late. The fungus had taken over Tommy's body. He was no longer a boy but a creature made entirely of fungus. He could no longer speak, but instead emitted a low humming sound. And wherever he went, mushrooms grew in his wake. The doctors were baffled. They had never seen anything like it before. The fungus had consumed Tommy's entire body, leaving nothing of the boy they once knew.", "Now, the people in the town tell stories of the fungus child, a creature that roams the woods at night, spreading mushrooms wherever it goes. They say that if you see it, you should run as fast as you can, or you might become infected too."]}, {"title": "Clean Up Time", "paras": ["Once upon a time, there were three children named James, Lily, and Jack who loved to stay at their grandparents' cottage in the Mourne Mountains. Every year, they would visit the quaint Irish cottage and have a fun time exploring the countryside and playing games indoors.", "However, the children had a bad habit of making a mess wherever they went. They would eat Pringles and scatter crumbs all over the place, not bothering to clean up after themselves. Their grandparents would scold them and tell them to be more careful, but the children would always forget.", "One year, after their visit, something strange happened. The mess the children left behind began to move and twitch on its own, as if it were alive. It started to take on a life of its own, growing and evolving into a creature that lived down the back of the old sofa in the living room.", "The creature was a grotesque, sentient monster made entirely of Pringles and crumbs. It had big, bulging eyes and long, slimy tentacles that slithered out of the sofa. The creature was angry at the children for leaving such a mess behind and decided to get revenge.", "The next time the children visited the cottage, they had no idea what was waiting for them. They settled down in the living room and began to watch television, unaware of the creature lurking behind the sofa. Suddenly, the monster lunged out, its tentacles wrapping around the children and pulling them towards its gaping maw.", "Just as the children were about to be devoured, a coo coo bird flew into the cottage and perched on top of the monster's head. The bird began to peck at the creature's eyes, causing it to release the children and thrash about in pain.", "The children quickly ran out of the cottage, chased by the howling monster. But the coo coo bird was not done yet. It kept attacking the creature, pecking at its eyes and driving it away from the cottage.", "The children were safe, thanks to the brave coo coo bird. They ran to their grandparents and told them what had happened. Their grandparents were shocked but relieved that the children were okay.", "From that day on, the children never left a mess behind when they visited the cottage. And whenever they saw a coo coo bird, they thanked it for saving their lives. The monster made of Pringles and crumbs was never seen again, and the cottage remained a peaceful place for all who visited it."]}, {"title": "Poo Man", "paras": ["Once upon a time, in Crawfordburn Country Park, there was a man who had a peculiar hobby. He enjoyed picking up sticks and wiping dog poo on them, then smearing it on unsuspecting park visitors.", "The man had become notorious in the park and was known as the \"Poo Man.\" People would steer clear of him, afraid of becoming his next victim. But one day, a group of friends decided to take matters into their own hands and catch the Poo Man in the act.", "They set up a stakeout, waiting for the Poo Man to strike. After a while, they spotted him walking down the path, looking for his next victim. One of the friends grabbed a bag of fake dog poo and placed it on the ground, pretending to walk away.", "The Poo Man fell for the trap, picking up the fake poo and smearing it on his stick. But when he tried to find a victim to smear it on, he couldn't find anyone. The friends had all scattered, leaving him alone.", "As he walked through the park, feeling disappointed, the Poo Man suddenly heard a strange noise behind him. He turned around to see a group of dogs running towards him, barking and growling. The Poo Man tried to run, but he tripped and fell into a pile of real dog poo.", "As he lay there, covered in poo, the dogs continued to bark and circle around him. The Poo Man realised the error of his ways and decided to give up his disgusting hobby.", "From that day on, the Poo Man was never seen again in Crawfordburn Country Park. And the friends who had set the trap laughed about it for years, telling the story of the Poo Man and his comeuppance to anyone who would listen."]}, {"title": "What’s that shadow?", "paras": ["Deep in the heart of the mountains, there was a crystal-clear stream. The water was cool and inviting, and many people would come from miles around to go open-water swimming. But there was a dark secret hidden beneath the surface of the stream: a creature that lived in the shadows, waiting to strike.", "The locals called it the \"Thing in the Stream.\" It was said to be a grotesque, slimy creature that would hide underwater and bite the toes of anyone who dared to venture too far from the shore. The locals warned visitors to be careful, but some ignored the warnings and paid a terrible price. One day, a group of teenagers decided to go swimming in the stream. They laughed and splashed around, enjoying the cool water on a hot summer day. But as they swam further from the shore, they felt something brush against their toes.", "At first, they thought it was just a piece of weed or a rock. But then they felt a sharp pain, and one of them screamed. The others looked down to see a dark shape lurking just below the surface of the water. They scrambled back to shore, their hearts pounding with fear.", "But it was too late for one of them. The creature had bitten off the toes of the unlucky teenager, leaving a bloody stump where his foot used to be. The others were horrified and ran to get help, but when they returned with the authorities, the creature had vanished.", "From that day on, the locals refused to go near the stream, and visitors stayed away. The Thing in the Stream had claimed another victim, and it was clear that it would not stop until it had devoured them all.", "The authorities searched the stream for days, but they found nothing. The creature had disappeared without a trace. Some said that it had moved on to a new location, while others believed that it was still lurking in the shadows, waiting for its next victim.", "The legend of the Thing in the Stream lives on, a warning to all who dare to swim in the open water. The locals tell stories of the creature's horrific attacks, and visitors to the area shudder at the thought of what lies hidden beneath the surface of the stream."]}, {"title": "Coo Coo", "paras": ["In the Mourne Mountains, there is a legend about a ghost coo coo bird that haunts the land. According to local lore, the bird's eerie coo coo sound can be heard echoing through the hills, waking up unsuspecting campers and hikers in the middle of the night.", "Many people have reported hearing the sound of the ghost coo coo bird, and some even claim to have seen it lurking in the shadows. It's said that the bird is the spirit of an ancient creature that roamed the mountains long ago, and that its haunting call is a warning to all who dare to explore its domain.", "One night, a group of friends decided to go camping in the Mourne Mountains. They set up their tents and started a fire, enjoying the peaceful sounds of the night. But as they settled down to sleep, they heard a strange coo coo sound coming from the darkness.", "At first, they tried to ignore it, thinking it was just a regular bird. But the coo coo sound grew louder and more persistent, and soon it was impossible to ignore. The friends huddled together in fear, wondering what could be making such a terrifying noise.", "Suddenly, they heard the sound of wings flapping in the air, and a dark figure swooped down from the sky. It was the ghost coo coo bird, its eyes glowing with an otherworldly light. The friends screamed and ran for their lives, but the bird followed them, its coo coo call growing louder and more menacing.", "Eventually, they stumbled upon an old abandoned cabin, and they ran inside, hoping to find safety. But the ghost coo coo bird followed them, its coo coo call echoing through the cabin walls. The friends huddled together, praying for daylight to come.", "When morning finally arrived, the friends emerged from the cabin, pale and shaken but alive. They never forgot their encounter with the ghost coo coo bird of the Mourne Mountains, and they warned others to be careful when venturing into the hills at night. The ghost coo coo bird still haunts the area to this day, its coo coo call a constant reminder of the dangers that lurk in the darkness."]}, {"title": "Tea Time", "paras": ["Once upon a time, there was a curious and adventurous boy named Tim who loved to explore new things. One day, while digging a hole in his backyard, he had an idea. He decided to dig a hole all the way through the earth and see where he would end up. With his trusty shovel, he started digging and digging until he finally reached the other side.", "To his surprise, he found himself in the beautiful country of Australia, surrounded by lush green trees and strange creatures he had never seen before. As he looked around, he spotted a koala sitting in a nearby tree, munching on some eucalyptus leaves.", "\"Hello there!\" Tim called out to the koala. \"My name is Tim. What's yours?\"", "The koala looked down at him and replied in a slow, sleepy voice, \"G'day, mate. My name is Kiki.\" Tim was fascinated by Kiki and asked him all sorts of questions about life in Australia. Kiki was happy to answer and even showed Tim some of his favourite spots in the bush.", "After spending a few days in Australia, Tim decided it was time to head back home. He invited Kiki to come to Ireland with him for some tea and biscuits. Kiki, being the adventurous koala he was, agreed and they set off on their journey.", "When they arrived in Ireland, Tim's family was thrilled to meet Kiki. They all sat down for a lovely tea party, but things took a strange turn when Kiki suddenly did a big poo on the table.", "\"Oh my!\" exclaimed Tim's mum, covering her nose.", "But to their surprise, Kiki picked up the poo and ate it.", "\"Oh no!\" Tim felt sick to his stomach.", "\"Don't worry, mate,\" Kiki said, noticing Tim's discomfort. \"We koalas have something called secondary digestion. We eat our poo to extract all the nutrients we missed the first time around. It's just how we roll.\"", "Tim was a bit grossed out, but he appreciated Kiki's explanation. They finished their tea and said goodbye to Kiki as he headed back to Australia.", "Despite the poo incident, Tim and Kiki remained good friends. They kept in touch and even planned to have more adventures together in the future. Tim learned that sometimes things can be strange and unexpected, but it's important to keep an open mind and embrace new experiences."]}, {"title": "Freak", "paras": ["The old house had always given off an eerie feeling. The walls were made of cracked and decaying wood, and the air was damp and musty. However, nothing had prepared me for what I was about to experience.", "It was a dark and stormy night when I heard strange noises coming from the bathroom sink. At first, I thought it was just the pipes rattling due to the wind, but then I heard a faint whisper. I leaned in closer to the sink and listened carefully. It sounded like a voice, but it was so faint that I couldn't make out what it was saying.", "Curiosity got the better of me, and I slowly turned on the tap. To my surprise, the water began to rise and bubble, and before I knew it, a dark figure emerged from the sink.", "It was a freakish creature, covered in slime and grime. Its eyes were sunken in and its skin was a sickly shade of green. It crawled out of the sink pipe and onto the bathroom floor, letting out a blood-curdling scream.", "I was frozen in fear, unable to move as the creature slowly made its way towards me. Its arms were long and slender, like tentacles, and its fingers ended in sharp claws.", "I tried to scream, but no sound came out. The creature was right in front of me now, its putrid breath filling my nostrils. It let out another scream, and I fell backwards, hitting my head on the wall.", "When I came to, the creature was gone. I was alone in the bathroom, with only the sound of the rain tapping against the window.", "The next morning, I tried to convince myself that it was all just a bad dream, but I couldn't shake the feeling that something was off about the house. I decided to do some research on the property and discovered that it had a dark history.", "The previous owners had all reported strange occurrences, including sightings of a freakish creature that would crawl out of the sink pipes. Some even claimed that the creature had attacked them, leaving them with unexplained scratches and bruises.", "I knew then that I had to leave the house, but before I could do so, I had one final encounter with the creature.", "It was another stormy night, and I had just finished taking a shower when I heard the same whispers coming from the sink. I tried to ignore it, but the whispers grew louder and more insistent.", "I approached the sink with caution, and to my horror, the creature once again emerged from the pipe. This time, it was more aggressive, its screams filling the room.", "I knew I had to act fast, so I grabbed a nearby towel and swung it at the creature. It let out a deafening screech and retreated back into the sink pipe.", "I never saw the creature again, but the experience had left me shaken to my core. I packed my bags and left the house, vowing to never return.", "To this day, I still can't explain what happened in that old, creepy house. Was it a figment of my imagination, or was it something more sinister? One thing is for sure: I will never forget the freak who came out of the sink pipe."]}, {"title": "Yellow Man", "paras": ["John's obsession with the colour yellow had reached a fever pitch. His once modest home was now completely consumed by the bright hue, with yellow walls, yellow furniture, and yellow knick-knacks littering every surface. Even his clothes and skin had taken on a sickly yellow tint. But what was most disturbing was the collection of jars lining the shelves of his basement, each one containing a human tongue. The jars had multiplied in number since he first started collecting them, and now they filled the entire room.", "It wasn't just the collection of tongues that made John terrifying; it was the way he talked about them. He spoke of the tongues as if they were his closest friends, describing each one in detail, down to the taste and texture.", "The townspeople whispered about John's strange behaviour, but no one dared to confront him. That is, until one day, a group of teenagers decided to break into his house.", "The moment they entered the basement, they were assaulted by the stench of decay. They saw the rows upon rows of jars and were paralysed with fear. But what they didn't expect was for John to suddenly appear behind them, a crazed look in his eyes.", "He lunged at them, his yellow-stained teeth bared, and they screamed as they ran back up the stairs. John chased them through the house, his heavy footsteps echoing off the yellow walls. The teenagers managed to escape, but they were never the same. The image of John's twisted face and the rows of tongues haunted them in their nightmares.", "Days turned into weeks, and the town grew more and more uneasy. People reported strange noises coming from John's house at all hours of the day, and some claimed to have seen him prowling the streets at night, his yellow-stained clothes and skin glowing in the darkness.", "But it wasn't until the night John died that the true horror of his obsession was revealed.", "The police arrived at the house to find John's body lying on the floor, surrounded by jars of tongues. But it was what they found in the basement that made their blood run cold.", "The yellow walls were now covered in flesh. Layers upon layers of human tongues had been sewn together, forming a grotesque and horrific tapestry that covered every inch of the room.", "The sight was too much for even the most seasoned of officers, and several were physically sick. But what chilled them to the bone was the sound that filled the room: a wet, squelching noise that seemed to come from the walls themselves.", "As they listened in terror, the sound grew louder and more frenzied, until it suddenly stopped. And then, a voice, whispering in the darkness.", "\"You can never leave me, my precious tongues. You will always be with me, forever and ever.\" The town eventually decided to demolish the house, but even after it was gone, people still talked about John and his grotesque obsession with yellow walls and human tongues.", "And on quiet nights, when the wind blew just right, you could hear the faint sound of someone licking the walls."]}, {"title": "Rats on bicycles", "paras": ["Once upon a time, in a city much like any other, there were rats who lived on bicycles. They had taken over an abandoned bike shop and had made it their home. The rats, who were a curious and adventurous bunch, had heard rumours of a magical place called Tesco, where there was an endless supply of delicious food.", "One day, the bravest rat of them all, a little guy named Speedy, stood up and declared that he would lead a group of rats on a journey to Tesco. The other rats were hesitant at first, as they had heard stories of traps and cats at Tesco, but Speedy was persuasive and eventually convinced them to join him.", "The group of rats set off on their bicycles, riding through the streets of the city. They encountered many obstacles along the way, dodging cars and pedestrians and narrowly avoiding getting caught in the spokes of their wheels. But they pressed on, knowing that the promise of Tesco was worth any danger they might face.", "Finally, after a long and treacherous journey, the rats arrived at Tesco. They parked their bicycles outside and scampered inside, their noses twitching with anticipation. They marvelled at the aisles and aisles of food, the mountains of cheese and the towers of bread.", "The rats were in heaven, and they spent hours stuffing their cheeks with all the goodies they could find. They were having so much fun that they didn't notice the store's security guard creeping up on them.", "Just as the guard was about to catch them, Speedy had a stroke of genius. He grabbed a bottle of soda called Irn-Bru and sprayed it all over the guard. The guard was so surprised that he stumbled backwards and fell, giving the rats just enough time to escape.", "The rats made it back to their bicycle shop, exhausted but happy. They had discovered a magical place, and they had managed to get away with it. From that day on, they made regular trips to Tesco, always armed with a bottle of Irn-Bru just in case they ran into trouble again.", "And so, the rats on bicycles continued to go on their adventures, exploring the city and finding new and exciting things to discover."]}];</script>
<script>/* ==========================================================================
   Daddy's Tales: art library
   Everything is painted in code as SVG, in the same watercolour-on-paper
   style as "A Timeless Christmas Tree". Each scene is a stack of layers:
   the back layer lies flat and the others pop up off the page.
   ========================================================================== */
'use strict';

const Art = (() => {
  let UID = 0;
  const DEFS = [];
  const nid = () => 'a' + (UID++).toString(36);

  // Seeded random, so every scene paints the same way each time.
  let _s = 1;
  const seed = (n) => { _s = n * 9301 + 49297; };
  const rnd = () => { _s = (_s * 9301 + 49297) % 233280; return _s / 233280; };
  const rr = (a, b) => a + rnd() * (b - a);
  const f = (n) => Math.round(n * 10) / 10;

  // ---- gradients -------------------------------------------------------
  function lg(stops, x2 = 0, y2 = 1) {
    const id = nid();
    const st = stops.map((c, i) => Array.isArray(c)
      ? `<stop offset="${c[0]}" stop-color="${c[1]}" stop-opacity="${c[2] ?? 1}"/>`
      : `<stop offset="${i / (stops.length - 1)}" stop-color="${c}"/>`).join('');
    DEFS.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${st}</linearGradient>`);
    return `url(#${id})`;
  }
  function rg(stops) {
    const id = nid();
    const st = stops.map((c) => `<stop offset="${c[0]}" stop-color="${c[1]}" stop-opacity="${c[2] ?? 1}"/>`).join('');
    DEFS.push(`<radialGradient id="${id}">${st}</radialGradient>`);
    return `url(#${id})`;
  }

  // ---- paths -----------------------------------------------------------
  function smooth(pts, closed) {
    const p = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : [pts[0], ...pts, pts[pts.length - 1]];
    let d = `M${f(p[1][0])},${f(p[1][1])}`;
    for (let i = 1; i < p.length - 2; i++) {
      const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1], [x3, y3] = p[i + 2];
      d += `C${f(x1 + (x2 - x0) / 6)},${f(y1 + (y2 - y0) / 6)} ${f(x2 - (x3 - x1) / 6)},${f(y2 - (y3 - y1) / 6)} ${f(x2)},${f(y2)}`;
    }
    return d + (closed ? 'Z' : '');
  }
  function blob(cx, cy, rx, ry, fill, jit = 0.12, n = 9, extra = '') {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, k = 1 + rr(-jit, jit);
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return `<path d="${smooth(pts, true)}" fill="${fill}" ${extra}/>`;
  }
  const ink = 'stroke="#2a1d14" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"';

  // ---- landscape -------------------------------------------------------
  function sky(stops) { return `<rect x="-20" y="-20" width="440" height="540" fill="${lg(stops)}"/>`; }
  function stars(n, maxY = 260, s = 7) {
    seed(s); let o = '';
    for (let i = 0; i < n; i++) {
      const r = rr(.5, 1.5);
      o += `<circle class="twinkle" style="animation-delay:${f(rr(0, 4))}s" cx="${f(rr(0, 400))}" cy="${f(rr(0, maxY))}" r="${f(r)}" fill="#fff8e0"/>`;
    }
    return o;
  }
  function moon(x, y, r, crescent, col = '#f6edc8') {
    const glow = rg([[0, col, .45], [1, col, 0]]);
    let o = `<circle cx="${x}" cy="${y}" r="${r * 3}" fill="${glow}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;
    if (crescent) o += `<circle cx="${x + r * .45}" cy="${y - r * .2}" r="${r * .9}" fill="${crescent}"/>`;
    else o += `<circle cx="${x - r * .3}" cy="${y - r * .2}" r="${r * .22}" fill="#000" opacity=".06"/><circle cx="${x + r * .35}" cy="${y + r * .3}" r="${r * .15}" fill="#000" opacity=".06"/>`;
    return o;
  }
  function ridge(y, h, col, s, step = 30, bottom = 520) {
    seed(s); const pts = [];
    for (let x = -30; x <= 430; x += step * rr(.6, 1.3)) pts.push([x, y - rnd() * h]);
    pts.push([440, y - rnd() * h]);
    return `<path d="${smooth(pts)}L440,${bottom}L-40,${bottom}Z" fill="${col}"/>`;
  }
  function hill(y, amp, col, s, bottom = 520) {
    seed(s); const pts = []; const ph = rr(0, 6);
    for (let x = -30; x <= 440; x += 40) pts.push([x, y + Math.sin(x / 70 + ph) * amp + rr(-amp * .3, amp * .3)]);
    return `<path d="${smooth(pts)}L440,${bottom}L-40,${bottom}Z" fill="${col}"/>`;
  }
  function pine(x, y, h, col = '#2f4a3a', snow = false, dark) {
    const w = h * .5; let o = `<rect x="${f(x - h * .025)}" y="${f(y - h * .14)}" width="${f(h * .05)}" height="${f(h * .14)}" fill="#4a3022"/>`;
    const tiers = 5;
    for (let i = 0; i < tiers; i++) {
      const tb = y - h * .1 - i * h * .16, tw = w * (1 - i / (tiers + .6)), th = h * .3;
      const jag = []; const n = 6;
      for (let j = 0; j <= n; j++) jag.push(`${f(x - tw / 2 + (tw * j) / n)},${f(tb + (j % 2 ? -h * .025 : 0))}`);
      o += `<path d="M${f(x)},${f(tb - th)}L${jag.join('L')}Z" fill="${i % 2 && dark ? dark : col}"/>`;
      if (snow) o += `<path d="M${f(x - tw * .42)},${f(tb - 2)}Q${f(x)},${f(tb - 6)} ${f(x + tw * .42)},${f(tb - 2)}" stroke="#eef0f6" stroke-width="${f(h * .015 + .6)}" fill="none" stroke-linecap="round" opacity=".85"/>`;
    }
    return o;
  }
  function tree(x, y, h, col = '#4e6b3a', trunk = '#4a3022', s = 3) {
    seed(s);
    let o = `<path d="M${x - h * .05},${y}L${x - h * .03},${y - h * .55}L${x + h * .03},${y - h * .55}L${x + h * .05},${y}Z" fill="${trunk}"/>`;
    for (let i = 0; i < 5; i++) o += blob(x + rr(-h * .22, h * .22), y - h * rr(.55, .85), h * rr(.18, .26), h * rr(.15, .22), col, .18);
    o += blob(x, y - h * .78, h * .26, h * .2, col, .15);
    return o;
  }
  function bareTree(x, y, h, col = '#3a2a22', s = 5) {
    seed(s);
    let o = `<path d="M${x - h * .04},${y}Q${x - h * .02},${y - h * .5} ${x + h * .01},${y - h * .7}L${x + h * .03},${y - h * .68}Q${x + h * .03},${y - h * .4} ${x + h * .05},${y}Z" fill="${col}"/>`;
    for (let i = 0; i < 6; i++) {
      const by = y - h * rr(.35, .68), dir = i % 2 ? 1 : -1, len = h * rr(.2, .38);
      o += `<path d="M${x},${f(by)}Q${f(x + dir * len * .5)},${f(by - len * .2)} ${f(x + dir * len)},${f(by - len * rr(.4, .8))}" stroke="${col}" stroke-width="${f(h * .018)}" fill="none" stroke-linecap="round"/>`;
    }
    return o;
  }
  function cottage(x, y, w, opt = {}) {
    // A whitewashed Irish cottage with a rounded thatch roof.
    const h = w * .42, wall = opt.wall || '#efe9dc', roof = opt.roof || '#9a7a45', door = opt.door || '#8c2a22';
    const lit = opt.lit !== false, win = lit ? '#ffd774' : '#3c4258';
    let o = '';
    if (lit) o += `<ellipse cx="${x}" cy="${y - h * .4}" rx="${w * .8}" ry="${h}" fill="${rg([[0, '#ffd774', .25], [1, '#ffd774', 0]])}"/>`;

    o += `<rect x="${x - w * .07}" y="${y - h * .62}" width="${w * .14}" height="${h * .62}" rx="2" fill="${door}" ${ink}/>`;

  }
  function rain(n = 60, s = 4) {
    seed(s); let o = '<g class="rain">';
    for (let i = 0; i < n; i++) { const x = rr(-20, 420), y = rr(-40, 500); o += `<path d="M${f(x)},${f(y)}l-5,16" stroke="#cfd8ea" stroke-width="1" opacity=".55"/>`; }

  function eyes(x, y, col = '#ffd84a', r = 3, gap = 9, cls = 'blink') {

    return `<g class="${cls}"><circle cx="${x}" cy="${y}" r="${r * 5}" fill="${g}"/><circle cx="${x - gap / 2}" cy="${y}" r="${r}" fill="${col}"/><circle cx="${x + gap / 2}" cy="${y}" r="${r}" fill="${col}"/><circle cx="${x - gap / 2}" cy="${y}" r="${r * .35}" fill="#1a1010"/><circle cx="${x + gap / 2}" cy="${y}" r="${r * .35}" fill="#1a1010"/></g>`;
  }
  function bubble(x, y, w, h, text, tail = 'left', fs = 15) {
    const tx = tail === 'left' ? x + w * .2 : x + w * .8;
    return `<g><path d="M${x + 8},${y}H${x + w - 8}Q${x + w},${y} ${x + w},${y + 8}V${y + h - 8}Q${x + w},${y + h} ${x + w - 8},${y + h}H${tx + 8}L${tx - (tail === 'left' ? 10 : -10)},${y + h + 14}L${tx - 4},${y + h}H${x + 8}Q${x},${y + h} ${x},${y + h - 8}V${y + 8}Q${x},${y} ${x + 8},${y}Z" fill="#fffaf0" ${ink}/><text x="${x + w / 2}" y="${y + h / 2 + fs * .35}" text-anchor="middle" font-family="IM Fell English, serif" font-size="${fs}" fill="#3a2418">${text}</text></g>`;

  // ---- people ----------------------------------------------------------
  // Paper-doll figures like the family in the tree game. Feet at (x,y).
  function person(x, y, s = 1, o = {}) {
    const coat = o.coat || '#7a3b2a', legs = o.legs || '#3b3a4a', skin = o.skin || '#f0c9a6',

    else if (o.hairStyle !== 'none') g += `<path d="M${-hr},${top - 1}Q${-hr},${top - hr - 2} 0,${top - hr - 1}Q${hr},${top - hr - 2} ${hr},${top - 1}Q${hr * .4},${top - hr * .55} ${-hr},${top - 1}Z" fill="${hair}"/>`;
    if (o.hat) g += `<rect x="${-hr - 4}" y="${top - hr + 1}" width="${hr * 2 + 8}" height="3" fill="${o.hat}"/><rect x="${-hr * .7}" y="${top - hr * 2}" width="${hr * 1.4}" height="${hr * 1.1}" fill="${o.hat}"/>`;
    const ey = top - 1;
    if (o.face === 'scared') g += `<circle cx="-4" cy="${ey}" r="2.2" fill="#fff"/><circle cx="4" cy="${ey}" r="2.2" fill="#fff"/><circle cx="-4" cy="${ey}" r="1" fill="#222"/><circle cx="4" cy="${ey}" r="1" fill="#222"/><ellipse cx="0" cy="${top + 6}" rx="2.4" ry="3" fill="#5a2020"/>`;
